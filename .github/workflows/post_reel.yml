# Account 2 (anime) - Instagram + Facebook Page only (no YouTube).
# Paste this into the file in the repo at exactly this path:
#   .github/workflows/post_reel.yml
# (GitHub only recognizes workflows inside that folder)
#
# 6-7 reels a day: six fixed slots, plus a 7th "bonus" slot that runs on a
# coin flip, so some days get 6 reels and some get 7. Each reel goes out a
# random 0-5 minutes after its slot. Keep at least 7 videos a day in the
# Reels folder.

name: Post anime reel - Account 2 (Instagram + Facebook)

on:
  schedule:
    # All times in UTC (IST = UTC+5:30). Odd minutes on purpose: GitHub is
    # busiest at the top of the hour and delays runs there.
    - cron: "7 3 * * *" # 08:37 AM IST
    - cron: "13 5 * * *" # 10:43 AM IST
    - cron: "23 7 * * *" # 12:53 PM IST
    - cron: "37 9 * * *" # 03:07 PM IST
    - cron: "41 11 * * *" # 05:11 PM IST
    - cron: "53 13 * * *" # 07:23 PM IST
    - cron: "17 15 * * *" # 08:47 PM IST  <- bonus slot, runs on a coin flip
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

# One run at a time, so two runs can never grab the same video.
concurrency:
  group: anime-reel-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r anime_requirements.txt

      - name: Run poster
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          POSTED_FOLDER_ID: ${{ secrets.POSTED_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          # Bonus slot: skip it on about half of the days (6 reels instead of 7).
          if [ "$SCHEDULE" = "17 15 * * *" ] && [ $((RANDOM % 2)) -eq 0 ]; then
            echo "Bonus slot skipped today."
            exit 0
          fi
          # Scheduled runs wait 0-5 minutes so the post time varies a little.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            sleep $(( RANDOM % 300 ))
          fi
          python anime_poster.py
