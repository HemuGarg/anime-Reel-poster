# Account 2 (anime) - Instagram + Facebook Page only (no YouTube).
# Paste this into a NEW file in the new repo, at exactly this path:
#   .github/workflows/post_reel.yml
# (GitHub only recognizes workflows inside that folder)

name: Post anime reel - Account 2 (Instagram + Facebook)

on:
  schedule:
    # All times in UTC (IST = UTC+5:30). Change these lines to move the slots.
    - cron: "30 18 * * *" # 12:00 AM IST -> posts between 12-1 AM IST
    - cron: "30 6 * * *" # 12:00 PM IST -> posts between 12-1 PM IST
    - cron: "30 12 * * *" # 6:00 PM IST -> posts between 6-7 PM IST
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r anime_requirements.txt

      - name: Wait a random number of minutes (0-59)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 3600 ))

      - name: Run poster
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          POSTED_FOLDER_ID: ${{ secrets.POSTED_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python anime_poster.py
